<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090704"><title>The Damage We Keep</title><style>
:root{--gold:#d09a2d;--gold2:#a9751d;--black:#090806}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080604;color:#f3eee3;font-family:Arial,Helvetica,sans-serif}body{background-image:linear-gradient(rgba(0,0,0,.12),rgba(0,0,0,.25)),url('img/cinematic-bg.png');background-position:center top;background-size:cover;background-attachment:fixed;background-repeat:no-repeat}.page{width:min(1180px,96vw);margin:auto;padding:3vh 0 5vh}.brand-space{height:clamp(235px,35vw,430px);display:flex;align-items:center;justify-content:center}.cover-art{max-height:100%;max-width:min(430px,92%);width:auto;height:auto;object-fit:contain;border-radius:10px;box-shadow:0 18px 46px rgba(0,0,0,.65),0 0 0 1px rgba(208,154,45,.55)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}.panel{background:linear-gradient(180deg,rgba(11,10,8,.92),rgba(8,8,7,.88));border:1px solid rgba(208,154,45,.7);box-shadow:0 14px 38px rgba(0,0,0,.55),inset 0 0 35px rgba(255,255,255,.025);border-radius:8px;padding:20px 22px 18px;backdrop-filter:blur(4px)}.heading{text-align:center;color:var(--gold);font-weight:900;letter-spacing:.16em;font-size:clamp(25px,3vw,42px);margin:0 0 8px;text-transform:uppercase}.rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 0 14px}.track{display:grid;grid-template-columns:28px 1fr 34px 34px;align-items:center;gap:7px;min-height:42px;border-bottom:1px solid rgba(255,255,255,.055)}.track:last-child{border-bottom:0}.num{font-size:11px;color:#d9c9a6}.title{font-size:13px;font-weight:700;letter-spacing:.025em;text-transform:uppercase;line-height:1.15}.play,.dl{border:2px solid var(--gold);background:rgba(0,0,0,.5);color:var(--gold);width:29px;height:29px;border-radius:50%;display:grid;place-items:center;font-size:12px;padding:0;cursor:pointer;text-decoration:none;box-sizing:border-box}.dl{font-size:14px}.dl:hover,.play:hover{background:rgba(208,154,45,.18)}.track.playing{background:rgba(208,154,45,.08)}.album{text-align:center;margin:26px 0 0;color:var(--gold);letter-spacing:.38em;text-transform:uppercase;font-size:15px;text-shadow:0 2px 5px #000}.album:before,.album:after{content:'';display:inline-block;width:80px;height:1px;background:var(--gold);vertical-align:middle;margin:0 18px}.mobile-title{display:none}.tabs{display:none}@media(max-width:760px){body{background-size:auto 100vh;background-position:center top;background-attachment:scroll}.page{width:94vw;padding-top:0}.brand-space{height:46vh;min-height:320px;max-height:470px}.grid{display:block}.panel{display:none;padding:16px 13px}.panel.active{display:block}.tabs{display:flex;gap:10px;justify-content:center;margin:0 0 14px}.tabs button{flex:1;max-width:180px;border:1px solid var(--gold2);border-radius:999px;padding:12px;background:#0c0b09;color:#eee;font-weight:800;font-size:16px}.tabs button.active{background:var(--gold);color:#0b0906}.heading{font-size:27px}.track{grid-template-columns:25px 1fr 30px 30px;min-height:46px;gap:6px}.play,.dl{width:27px;height:27px}.title{font-size:12px}.album{font-size:11px;letter-spacing:.24em}.album:before,.album:after{width:30px;margin:0 8px}}
</style></head><body><main class="page"><div class="brand-space"><img class="cover-art" src="img/album-cover.png" alt="The Damage We Keep — All We Left Behind"></div><div class="tabs"><button class="active" data-tab="heavy">Heavy</button><button data-tab="acoustic">Acoustic</button></div><div class="grid"><section id="heavy" class="panel active"><h2 class="heading">Heavy</h2><div class="rule"></div></section><section id="acoustic" class="panel"><h2 class="heading">Acoustic</h2><div class="rule"></div></section></div><div class="album">All We Left Behind</div></main><audio id="audio" preload="none"></audio><script>
const heavy=[['All We Left Behind',"01 - All We Left Behind.mp3"],['Sunshine on Me',"02 - Sunshine on Me.mp3"],['Never Be Enough',"03 - Never Be Enough.mp3"],["Since '82","04 - Since '82.mp3"],['Sorry I Was So Broken',"05 - Sorry I Was So Broken.mp3"],['Before the Secrets & Lost Tomorrows',"06 - Before the Secrets & Lost Tomorrows.mp3"],['I Want That One Back',"07 - I Want That One Back.mp3"],['Static in My Voice',"08 - Static in My Voice.mp3"],['Credit for the Scars I Keep',"09 - Credit for the Scars I Keep.mp3"],['Unbothered',"10 - Unbothered.mp3"],['Waste of Space (Divided)',"11 - Waste of Space (Divided).mp3"],['Just Stay',"12 - Just Stay.mp3"],['Take It So Far',"13 - Take It So Far.mp3"],['Another Day Without You',"14 - Another Day Without You.mp3"],['Over in My Head',"15 - Over in My Head.mp3"],['Our Own / The Other Side (BLVD Remastered)',"16 - Our Own - The Other Side (BLVD Remastered).mp3"],['Cracks in These Walls',"17 - Cracks in These Walls.mp3"]];
const acoustic=[['The Map and the Wreckage of Me',"01 - The Map and the Wreckage of Me.mp3"],["Here's to the Memories","02 - Here's to the Memories.mp3"],['Sorry I Was So Broken',"03 - Sorry I Was So Broken.mp3"],['Static in My Voice',"04 - Static in My Voice.mp3"],['Chasing Shadows',"05 - Chasing Shadows.mp3"],['Before the Secrets & Lost Tomorrows',"06 - Before the Secrets & Lost Tomorrows.mp3"],['Caught in Your Own Confusion / Sunshine on Me',"07 - Caught in Your Own Confusion - Sunshine on Me.mp3"]];
const audio=document.querySelector('#audio');let current=null;
function render(id,arr){const el=document.querySelector('#'+id);arr.forEach((t,i)=>{const r=document.createElement('div');r.className='track';const num=String(i+1).padStart(2,'0');const url=`audio/${id}/${encodeURIComponent(t[1])}`;r.innerHTML=`<span class="num">${num}</span><span class="title">${t[0]}</span><button class="play" aria-label="Play ${t[0]}">▶</button><a class="dl" href="${url}" download="${t[1]}" aria-label="Download ${t[0]}">⬇</a>`;const b=r.querySelector('button');b.onclick=()=>{if(current===b&&!audio.paused){audio.pause();b.textContent='▶';return}document.querySelectorAll('.play').forEach(x=>{x.textContent='▶';x.closest('.track').classList.remove('playing')});audio.src=url;audio.load();audio.play().catch(()=>{b.textContent='!';r.classList.remove('playing')});current=b;b.textContent='Ⅱ';r.classList.add('playing')};el.appendChild(r)})}
render('heavy',heavy);render('acoustic',acoustic);audio.onended=()=>{if(current){current.textContent='▶';current.closest('.track').classList.remove('playing')}};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('#'+b.dataset.tab).classList.add('active')});
</script></body></html>
